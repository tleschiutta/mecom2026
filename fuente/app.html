<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#134082">
<meta name="description" content="Programa interactivo del XLII Congreso Argentino de Mecánica Computacional (MECOM 2026), Mendoza, 10 al 13 de noviembre.">
<link rel="manifest" href="manifest.json">
<script>
  (function(){ var t=null; try{ t=localStorage.getItem("mecom2026.tema"); }catch(e){}
    if(!t) t = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    document.documentElement.dataset.theme = t; })();
</script>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MECOM 2026 · Programa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=Open+Sans:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --base:#134082; --base-2:#2a5ba8; --base-soft:#e7eef8; --banda:rgba(19,64,117,.48); /* #134075 con 52% de transparencia */
  --tabs-h:56px; --title-h:78px;
  --bg:#f7f5f2; --card:#fff; --ink:#1d1b1a; --muted:#6b6560; --line:#e6e1db;
  --star:#d99a00; --warn:#b3261e;
  --r:14px;
}
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#141212; --card:#1e1b1b; --ink:#efeae6; --muted:#a39b95; --line:#322d2c; --base-soft:#1a2740; --base-2:#8db0e6; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.4}
button,input,select{font:inherit;color:inherit}
/* Encabezado: foto de montañas + banda translúcida con las pestañas.
   El título se va al hacer scroll; la banda de pestañas queda fija arriba. */
header{position:sticky;top:calc(-1 * var(--title-h));z-index:20;color:#fff;
  background:#1d3f6e url("__FONDO__") center 62%/cover no-repeat;}
.brand{height:var(--title-h);display:flex;align-items:flex-end;padding:0 18px 10px;max-width:760px;margin:0 auto;box-sizing:border-box}
.brand{justify-content:space-between;gap:12px}
.theme-btn{flex:none;width:42px;height:42px;margin-bottom:2px;border-radius:50%;border:1px solid #ffffff55;background:#ffffff22;color:#fff;
  display:grid;place-items:center;cursor:pointer;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.theme-btn:active{transform:scale(.94)}
.theme-btn svg{width:22px;height:22px}
.theme-btn[aria-expanded="true"] svg{transform:rotate(60deg)}
.theme-btn svg{transition:transform .25s}
/* Panel de configuración */
.cfg{position:fixed;z-index:50;right:max(12px,calc((100vw - 760px)/2 + 12px));top:64px;width:min(300px,calc(100vw - 24px));
  background:#2b2d31;color:#eee;border-radius:16px;padding:8px;box-shadow:0 12px 32px #0007;display:none}
.cfg.open{display:block}
.cfg .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 10px;border-radius:10px;font-size:15px;
  width:100%;background:none;border:0;color:inherit;text-align:left;cursor:pointer}
.cfg .row:active{background:#ffffff12}
.cfg .row + .row{border-top:1px solid #ffffff14}
.sw{width:44px;height:26px;border-radius:13px;background:#5a5d63;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
:root[data-theme="dark"] .sw{background:#3d7be0}
:root[data-theme="dark"] .sw::after{left:21px}
.cfg .ico{width:20px;height:20px;flex:none;opacity:.85}
.cfg .ico.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cfg .info{padding:10px 10px 6px;font-size:12.5px;line-height:1.45;color:#b9bcc2;border-top:1px solid #ffffff14}
.cfg .info b{color:#e6e7ea;font-weight:600}
.cfg .off{color:#ffcf70}
/* Filas de enlace en Configuración */
.cfg a.row{text-decoration:none}
.cfg .wa{width:24px;height:24px;flex:none}
.cfg .row.pronto{opacity:.85}
.cfg .row small{display:block;font-size:11.5px;color:#9a9da3;margin-top:2px}
/* Ventana de ayuda: ocupa toda la pantalla con el fondo translúcido */
.help{position:fixed;inset:0;z-index:70;background:rgba(10,14,22,.62);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
.help.open{display:flex}
.help .box{background:#2b2d31;color:#e9eaec;border-radius:20px;width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 18px 50px #0008;overflow:hidden}
.help .hd{padding:18px 20px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.help h2{margin:0;font-family:"Open Sans","IBM Plex Sans",sans-serif;font-size:21px;color:#fff}
.help .hd p{margin:4px 0 0;font-size:13.5px;color:#a9acb2}
.help .x{background:#ffffff14;border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer;flex:none}
.help .bd{overflow:auto;padding:4px 20px 8px;-webkit-overflow-scrolling:touch}
.help .it{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:11px 0;border-top:1px solid #ffffff12;font-size:14px;line-height:1.45}
.help .it:first-child{border-top:0}
.help .it .ic{width:34px;height:34px;border-radius:10px;background:#ffffff12;display:grid;place-items:center;font-size:17px}
.help .it b{color:#fff;display:block;margin-bottom:1px}
.help .it span.k{display:inline-block;padding:0 6px;border-radius:5px;background:#ffffff1c;color:#fff;font-size:12.5px}
.help .ft{padding:12px 20px 18px;border-top:1px solid #ffffff12}
.help .ft button{width:100%;padding:13px;border:0;border-radius:12px;background:var(--base);color:#fff;font-weight:700;font-size:16px;cursor:pointer}
body.noscroll{overflow:hidden}
/* Selector de idioma */
.lang{display:inline-flex;background:#ffffff14;border-radius:10px;padding:3px;gap:2px;flex:none}
.lang button{border:0;background:none;color:#c9cbd0;font:inherit;font-size:13.5px;font-weight:600;padding:6px 11px;border-radius:8px;cursor:pointer}
.lang button.on{background:#fff;color:#1d1f23}
.cfg .row.lg{cursor:default}
.help .lang{margin:0 20px 2px;align-self:flex-start}
/* Aviso de cambios en el programa */
.notice{position:fixed;left:50%;transform:translateX(-50%);bottom:72px;z-index:55;width:min(560px,calc(100vw - 24px));
  background:#1d2a44;color:#fff;border-radius:14px;padding:12px 44px 12px 14px;font-size:14px;line-height:1.4;box-shadow:0 10px 28px #0006;display:none}
.notice.show{display:block}
.notice.warn{background:#8a4b00}
.notice button{position:absolute;right:8px;top:8px;background:none;border:0;color:#fff;font-size:20px;line-height:1;cursor:pointer;padding:4px 6px}
.brand h1{margin:0;font-family:"Open Sans","IBM Plex Sans",sans-serif;font-weight:700;font-size:clamp(28px,8vw,40px);letter-spacing:-.3px;text-shadow:0 1px 6px #0006}
nav.tabs{display:flex;background:var(--banda);height:var(--tabs-h);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
nav.tabs .wrap{display:flex;width:100%;max-width:760px;margin:0 auto}
nav.tabs button{flex:1;background:none;border:0;color:#fff;opacity:.75;font-family:"Open Sans","IBM Plex Sans",sans-serif;font-weight:700;font-size:clamp(16px,4.6vw,20px);border-bottom:4px solid transparent;cursor:pointer;padding:0 4px;white-space:nowrap}
nav.tabs button.on{opacity:1;border-bottom-color:#fff}
@media (min-width:700px){ :root{ --title-h:110px; --tabs-h:60px; } }
nav.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:#fff;color:var(--base);font-size:11.5px;line-height:18px;vertical-align:2px;font-family:"IBM Plex Sans",sans-serif}
main{max-width:760px;margin:0 auto;padding:12px 12px 90px}
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.days button{flex:1;min-width:70px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:7px 6px;cursor:pointer;text-align:center}
.days button b{display:block;font-size:13px}
.days button span{font-size:12px;color:var(--muted)}
.days button.on{background:var(--base);border-color:var(--base);color:#fff}
.days button.on span{color:#fff;opacity:.85}
.filters{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:10px}
.filters input,.filters select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.slot{margin:16px 0 6px;display:flex;align-items:center;gap:8px;font-family:"IBM Plex Mono",monospace;font-size:13.5px;color:var(--base-2);font-weight:500;position:sticky;top:var(--tabs-h);background:var(--bg);padding:4px 0;z-index:5}
.slot::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;margin:6px 0;display:grid;grid-template-columns:1fr auto;gap:4px 10px;cursor:pointer}
.card.fav{border-color:var(--star);box-shadow:inset 3px 0 0 var(--star)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.chip{font-family:"IBM Plex Mono",monospace;font-size:11.5px;padding:1px 7px;border-radius:6px;color:#fff;font-weight:500}
.sala{font-weight:600;color:var(--ink)}
.title{grid-column:1;font-weight:600;font-size:14.5px}
.title.missing{color:var(--muted);font-weight:500;font-style:italic}
.authors{grid-column:1;font-size:13px;color:var(--muted)}
.star{grid-row:1/4;grid-column:2;align-self:start;background:none;border:0;font-size:24px;line-height:1;cursor:pointer;color:var(--line);padding:2px}
.card.fav .star{color:var(--star)}
.event{border-radius:var(--r);padding:10px 12px;margin:6px 0;background:var(--base-soft);display:flex;justify-content:space-between;gap:10px;font-size:14px}
.event b{color:var(--base-2)}
:root[data-theme="dark"] .event b{color:#a9c3ea}
.event span{color:var(--muted);font-size:13px;white-space:nowrap}
/* Bloques de sesión */
.grp{margin:22px 0 24px}
.blk{display:flex;align-items:center;gap:10px;border-radius:14px;padding:12px 14px;margin:7px 0;color:#151515;cursor:pointer;user-select:none;
  font-family:"Open Sans","IBM Plex Sans",sans-serif;font-weight:700;font-size:clamp(13.5px,3.7vw,16px);line-height:1.25;transition:filter .15s}
.blk:active{filter:brightness(.95)}
.blk .nm{flex:1}
.blk .sl{font-family:"IBM Plex Sans",sans-serif;font-weight:400;white-space:nowrap}
.blk .chev{font-size:12px;opacity:.6;transition:transform .2s;margin-left:2px}
.blk.open .chev{transform:rotate(180deg)}
.blk-body{margin:-2px 0 12px 12px;padding:2px 0 2px 10px;border-left:4px solid var(--c)}
.blk-body .card{margin:6px 0}
.event.click{cursor:pointer}
.evnote{font-weight:400;font-size:12.5px;color:var(--muted);margin-top:2px}
.event.plen{background:#f3f7fc;border:1px solid #d9e4f3}
:root[data-theme="dark"] .event.plen{background:#253a5e;border-color:#2f4870}
.event .tt{display:inline-flex;align-items:center;gap:6px}
.event .chev{font-size:12px;opacity:.7;transition:transform .2s}
.event.open .chev{transform:rotate(180deg)}
.event .evr{display:flex;align-items:center;gap:8px}
.ev-info{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:-2px 0 10px;font-size:14px}
.ev-info dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0}
.ev-info dt{color:var(--muted)}
.ev-info dd{margin:0}
.ev-info .pend{color:var(--muted);font-style:italic}
/* Actividades que ya pasaron */
.past{opacity:.42}
.blk.past{opacity:.35;filter:saturate(.55)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.count{font-size:12.5px;color:var(--muted);margin:2px 2px 0}
.conflict{color:var(--warn);font-size:12.5px;font-weight:600;grid-column:1}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.btn{border:1px solid var(--base);background:var(--card);color:var(--base);padding:8px 12px;border-radius:10px;font-weight:600;cursor:pointer}
:root[data-theme="dark"] .btn{color:#a9c3ea;border-color:#a9c3ea}
.btn.solid{background:var(--base);color:#fff;border-color:var(--base)}
.now-head{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.now-head .clock{font-family:"IBM Plex Mono",monospace;font-size:26px;color:var(--base-2)}
.now-head label{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:6px}
h3.sec.day{font-size:14px;color:var(--base-2);margin-top:22px}
h3.sec{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:16px 2px 4px}
/* hoja de detalle */
.sheet-bg{position:fixed;inset:0;background:#0007;z-index:40;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:760px;margin:0 auto;background:var(--card);border-radius:18px 18px 0 0;padding:18px 18px 26px;z-index:41;transform:translateY(100%);visibility:hidden;transition:transform .2s ease,visibility 0s .2s;max-height:85vh;overflow:auto}
.sheet.open{transform:none;visibility:visible;transition:transform .2s ease}
.sheet-bg.open{display:block}
.sheet h2{font-size:18px;margin:8px 0}
.sheet dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;margin:12px 0}
.sheet dt{color:var(--muted)}
.sheet dd{margin:0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13.5px;opacity:0;transition:opacity .2s;z-index:60;pointer-events:none}
.toast.show{opacity:1}
footer{font-size:12px;color:var(--muted);text-align:center;margin-top:30px}
footer a{color:inherit}
footer .credit{margin:0 auto 14px;padding-top:16px;border-top:1px solid var(--line);max-width:520px;font-size:13px;line-height:1.5}
footer .credit b{color:var(--ink)}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>MECOM 2026</h1>
    <button class="theme-btn" id="cfgBtn" data-i18n-aria="cfg" aria-label="Configuración" title="Configuración" aria-expanded="false" aria-controls="cfg">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
  <nav class="tabs"><div class="wrap">
    <button data-tab="programa" class="on"><span data-i18n="tabProg">Programa</span></button>
    <button data-tab="ahora"><span data-i18n="tabNow">Ahora</span></button>
    <button data-tab="agenda"><span data-i18n="tabAg">Mi agenda</span><span class="badge" id="favCount">0</span></button>
  </div></nav>
</header>

<main>
  <section id="v-programa">
    <div class="days" id="days"></div>
    <div class="filters">
      <input id="q" type="search" data-i18n-ph="search" placeholder="Buscar título, autor o ID…" autocomplete="off">
      <select id="fSes"><option value="">Todas las sesiones</option></select>
    </div>
    <div class="count" id="count"></div>
    <div id="list"></div>
  </section>

  <section id="v-ahora" hidden>
    <div class="now-head">
      <div class="clock" id="clock">--:--</div>
      <div id="nowMsg" style="font-size:13.5px;color:var(--muted)"></div>
      <label><input type="checkbox" id="sim"> <span data-i18n="sim">Simular un momento del congreso:</span>
        <select id="simDay"></select><input type="time" id="simTime" value="14:25" step="300">
      </label>
    </div>
    <div id="nowList"></div>
  </section>

  <section id="v-agenda" hidden>
    <div class="toolbar">
      <button class="btn solid" id="btnIcs" data-i18n="ics">Exportar a calendario (.ics)</button>
      <button class="btn" id="btnCopy" data-i18n="copy">Copiar lista</button>
      <button class="btn" id="btnClear" data-i18n="clear">Vaciar</button>
    </div>
    <div id="agendaList"></div>
  </section>

  <footer>
    <p class="credit" data-i18n-html="credit"></p>
    <span data-i18n="dataSrc">Datos: programa oficial publicado por AMCA</span> · <span id="dataInfo"></span><br>
    <a href="https://amcaonline.org.ar/mecom2026/?page_id=635" target="_blank" rel="noopener" data-i18n="pdf">Ver programa oficial (PDF)</a>
  </footer>
</main>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div class="cfg" id="cfg" role="dialog" aria-label="Configuración">
  <div class="row lg"><span data-i18n="lang">Idioma</span>
    <span class="lang" role="radiogroup"><button data-lang="es" role="radio">Español</button><button data-lang="en" role="radio">English</button></span></div>
  <button class="row" id="cfgTheme" role="switch" aria-checked="false"><span data-i18n="dark">Modo oscuro</span><span class="sw"></span></button>
  <button class="row" id="cfgUpd"><span data-i18n="upd">Actualizar</span>
    <svg class="ico" id="updIco" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
  <button class="row" id="cfgHelp"><span data-i18n="howto">Cómo usar la app</span>
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2.6-3 4.5"/><path d="M12 17.5h.01"/></svg></button>
  <a class="row" id="cfgWa" href="#" target="_blank" rel="noopener"><span><span data-i18n="wa">Canal de WhatsApp</span><small id="waSub"></small></span>
    <svg class="wa" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="16" fill="#25D366"/>
      <path fill="#fff" d="M16 6.4c-5.3 0-9.6 4.3-9.6 9.6 0 1.8.5 3.5 1.4 5L6.4 25.6l4.7-1.4c1.4.8 3.1 1.3 4.9 1.3 5.3 0 9.6-4.3 9.6-9.6S21.3 6.4 16 6.4zm0 17.4c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-2.8.8.8-2.7-.2-.3c-.9-1.3-1.4-2.8-1.4-4.4 0-4.4 3.6-7.9 8-7.9s8 3.5 8 7.9-3.4 8-7.7 8z"/>
      <path fill="#fff" d="M20.4 18c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1l-.7.9c-.1.2-.3.2-.5.1-.7-.3-1.4-.7-2-1.3-.5-.5-1-1.1-1.3-1.7-.1-.2 0-.4.1-.5l.4-.5.2-.4v-.4l-.7-1.7c-.2-.5-.4-.4-.5-.4h-.5c-.2 0-.4.1-.6.3-.5.5-.8 1.2-.8 1.9 0 .8.3 1.6.8 2.2 1 1.4 2.2 2.5 3.7 3.2.5.2 1 .4 1.5.5.6.2 1.2.2 1.8.1.6-.1 1.2-.5 1.5-1 .1-.3.2-.7.1-1-.1-.1-.2-.1-.4-.2z"/></svg></a>
  <div class="info" id="cfgInfo"></div>
</div>
<div class="help" id="help" role="dialog" aria-modal="true" aria-labelledby="helpT">
  <div class="box">

// ---------- CSV (para la versión publicada con planilla en vivo) ----------
function parseCSV(t){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<t.length;i++){ const c=t[i];
    if(q){ if(c=='"'){ if(t[i+1]=='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c=='"') q=true; else if(c==','){row.push(f);f="";}
    else if(c=='\n'){row.push(f);rows.push(row);row=[];f="";} else if(c!='\r') f+=c; }
  if(f||row.length){row.push(f);rows.push(row);}
  const h=rows.shift().map(x=>x.trim());
  return rows.filter(r=>r.some(x=>x.trim())).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]??"").trim()])));
}

const fmtFecha = d => new Date(d).toLocaleString(T("locale"),{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});

function parseLive(text){
  // Google Sheets puede devolver horas como "8:00:00" y fechas como "10/11/2026": se normalizan.
  const hm = t => { const m = String(t).match(/^(\d{1,2}):(\d{2})/); return m ? m[1].padStart(2,"0")+":"+m[2] : t; };
  const ymd = d => { const m = String(d).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); return m ? `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}` : d; };
  if(!/^\s*id,tipo,/.test(text)) return null;                  // no es la planilla (p. ej. página de error)
  const items = parseCSV(text).filter(it => it.id && it.tipo && it.dia && it.inicio)
    .map(it => ({...it, id:String(it.id), dia:ymd(it.dia), inicio:hm(it.inicio), fin:hm(it.fin)}));
  if(items.length < Math.max(20, D.items.length * 0.5)) return null; // respuesta incompleta: se descarta
  return items;
}
const firma = it => [it.dia,it.inicio,it.fin,it.sala,it.titulo,it.autores,it.tema,it.disertante,it.presenta,it.descripcion,it.notas].join("|");
function cambios(viejos, nuevos){
  const a = new Map(viejos.map(it=>[it.id, it])), b = new Map(nuevos.map(it=>[it.id, it]));
  const ids = new Set([...a.keys(), ...b.keys()]);
  const out = [];
  for(const id of ids){ const x=a.get(id), y=b.get(id); if(!x || !y || firma(x)!==firma(y)) out.push({id, antes:x, ahora:y}); }
  return out;
}
function avisar(cs){
  if(!cs.length) return;
  const mios = cs.filter(c => favs.has(c.id));
  let msg = T("nUpd"), warn = false;
  if(mios.length){
    warn = true;
    const c = mios[0], it = c.ahora || c.antes;
    const nombre = `#${it.id}` + (it.titulo ? ` (${it.titulo.length>48 ? it.titulo.slice(0,46)+"…" : it.titulo})` : "");
    if(!c.ahora) msg = T("nRemoved", nombre);
    else if(c.antes && (c.antes.dia!==c.ahora.dia || c.antes.inicio!==c.ahora.inicio))
      msg = T("nMoved", nombre, DIAS_L[c.ahora.dia]||c.ahora.dia, c.ahora.inicio);
    else msg = T("nChanged", nombre);
    if(mios.length > 1) msg += T("nMany", mios.length);
  } else msg += T("nChanges", cs.length);
  $("#noticeTxt").textContent = msg;
  $("#notice").classList.toggle("warn", warn);
  $("#notice").classList.add("show");
  clearTimeout(avisar._h); if(!warn) avisar._h = setTimeout(()=>$("#notice").classList.remove("show"), 6000);
}
function aplicar(items, fuente, notificar){
  const cs = cambios(D.items, items);
  if(!cs.length && D.fuente === fuente) return;
  D = {...D, items, fuente};
  init();
  if(notificar) avisar(cs);
}
async function tryLive(manual){
  if(!CSV_URL || sync.cargando) return;
  sync.cargando = true; sync.intento = Date.now(); renderCfg();
  // 1) Al abrir: la última copia guardada (lo que la persona ya vio). Sirve sin conexión.
  if(!sync.visto){
    sync.visto = true;
    try{ const c = JSON.parse(localStorage.getItem(LIVE_KEY)||"null");
      const items = c && parseLive(c.text);
      if(items){ sync.ok = c.ts || null; sync.base = true; aplicar(items, "copia guardada", false); }
    }catch(e){}
  }
  // 2) La planilla en vivo (con tiempo máximo, para no colgarse con mala señal).
  let resultado = "error";
  try{
    const ctl = new AbortController(); const to = setTimeout(()=>ctl.abort(), 10000);
    const r = await fetch(CSV_URL, {cache:"no-store", signal:ctl.signal}); clearTimeout(to);
    if(r.ok){
      const text = await r.text(), items = parseLive(text);
      if(items){
        sync.ok = Date.now(); resultado = "ok";
        // Se avisa de cambios solo si la persona ya tenía datos de antes (no en la primera apertura).
        aplicar(items, "planilla", sync.base || sync.estado === "ok");
        sync.base = true;
        try{ localStorage.setItem(LIVE_KEY, JSON.stringify({text, ts: sync.ok})); }catch(e){}
      } else resultado = "invalido";
    }
  }catch(e){ resultado = navigator.onLine === false ? "offline" : "error"; }
  sync.estado = resultado === "ok" ? "ok" : (navigator.onLine === false ? "offline" : resultado);
  sync.cargando = false; renderCfg(); updFooter();
  if(manual) toast(resultado === "ok" ? T("tOk") : T("tOffline"));
}
function updFooter(){
  const n = D.items.filter(isTalk).length;
  const f = sync.ok ? T("updAt", fmtFecha(sync.ok)) : (D.fuente === "copia guardada" ? T("savedCopy") : T("version", D.version));

function renderCfg(){

  }
  document.querySelectorAll(".lang button").forEach(b => { b.classList.toggle("on", b.dataset.lang === LANG); b.setAttribute("aria-checked", b.dataset.lang === LANG); });
  $("#cfgInfo").innerHTML = h;
}
// ---------- Utilidades ----------
const open = new Set();   // bloques y plenarias desplegados
function isPast(it, now){ const {dia, hm} = now || nowParts(); return it.dia < dia || (it.dia === dia && (it.fin || it.inicio) <= hm); }
const pastCls = (it, now) => isPast(it, now) ? " past" : "";
const isPlen = it => it.tipo === "evento" && /plenaria/i.test(it.titulo);
const isTalk = it => it.tipo === "charla" || it.tipo === "poster";
const key = it => it.dia + " " + it.inicio;
function sesName(c){ return (LANG==="en" && SES_EN[c] ? SES_EN[c][0] : (D.sesiones[c] || c || "")); }
function sesCorto(c){ return LANG==="en" && SES_EN[c] ? SES_EN[c][1] : ((D.sesCorto||{})[c] || sesName(c) || "").toUpperCase(); }
function chip(c){ if(!c) return ""; const pc=(D.sesColor||{})[c]; return `<span class="chip" style="background:${pc||sesColor[c]||"#555"};color:${pc?"#151515":"#fff"}" title="${esc(sesName(c))}">${esc(c)}</span>`; }
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1800); }
function updBadge(){ $("#favCount").textContent = favs.size; }

function cardHTML(it, opts={}){
  const f = favs.has(it.id);
  const t = it.titulo ? `<div class="title">${esc(it.titulo)}</div>` : `<div class="title missing">${T("tTbc", esc(it.id))}</div>`;
  return `<div class="card ${f?"fav":""}${pastCls(it)}" data-id="${esc(it.id)}">
    <div class="meta">${opts.showTime?`<b>${esc(it.inicio)}</b>`:""}<span class="sala">${esc(salaTxt(it.sala))}</span>${chip(it.sesion)}<span>#${esc(it.id)}</span></div>
    <button class="star" data-star="${esc(it.id)}" aria-label="${T("addAg")}">${f?"★":"☆"}</button>
    ${t}
    ${it.autores?`<div class="authors">${esc(it.autores)}</div>`:""}
    ${opts.conflict?`<div class="conflict">${T("overlap")}</div>`:""}
  </div>`;
}
function eventHTML(it){
  const span = `${esc(it.inicio)}${it.fin?"–"+esc(it.fin):""}${it.sala?" · "+esc(salaTxt(it.sala)):""}`;
  const nota = it.notas ? `<div class="evnote">${esc(noteTxt(it.notas))}</div>` : "";
  if(!isPlen(it)) return `<div class="event${pastCls(it)}"><b>${esc(evTxt(it.titulo))}${nota}</b><span>${span}</span></div>`;
  const k = "ev:"+it.id, o = open.has(k);
  const pend = `<span class="pend">${T("tbc")}</span>`;
  const quien = it.disertante ? `<div class="evnote">${esc(it.disertante.replace(/\s*\(.*\)\s*$/,""))}${it.notas?" · "+esc(noteTxt(it.notas)):""}</div>` : "";
  return `<div class="event click plen${o?" open":""}${pastCls(it)}" data-open="${k}" role="button" aria-expanded="${o}"><b><span class="tt">${esc(evTxt(it.titulo))}<span class="chev">▾</span></span>${quien}</b><span>${span}</span></div>`
    + (o ? `<div class="ev-info${pastCls(it)}"><dl>
        <dt>${T("plTema")}</dt><dd>${it.tema?esc(it.tema):pend}</dd>
        <dt>${T("plDis")}</dt><dd>${it.disertante?esc(it.disertante):pend}</dd>
        ${it.presenta?`<dt>${T("plPres")}</dt><dd>${esc(it.presenta)}</dd>`:""}
        ${it.notas?`<dt>${T("dNotes")}</dt><dd>${esc(noteTxt(it.notas))}</dd>`:""}
        <dt>${T("plDesc")}</dt><dd>${it.descripcion?esc(it.descripcion):`<span class="pend">${T("plSoon")}</span>`}</dd>
      </dl></div>` : "");
}

// ---------- Vista Programa ----------
function renderProgram(){
  // Sin búsqueda ni sesión elegida: vista por bloques de sesión. Con filtro: lista de trabajos.
  if(!norm(state.q) && !state.ses) return renderBlocks();
  // Con búsqueda o sesión elegida se buscan resultados en TODO el congreso, agrupados por día y horario.
  const words = norm(state.q).split(" ").filter(Boolean);   // cada palabra tiene que aparecer (en cualquier orden)
  const items = D.items.filter(it => {
    if(!isTalk(it)) return false;
    if(state.ses && it.sesion !== state.ses) return false;
    const hay = norm(`${it.titulo} ${it.autores} ${it.id} ${it.sesion} ${D.sesiones[it.sesion]||""} ${(SES_EN[it.sesion]||[""])[0]}`);
    return words.every(w => hay.includes(w));
  }).sort((a,b)=> key(a).localeCompare(key(b)) || salaN(a.sala)-salaN(b.sala));
  const nT = items.length;
  $("#count").textContent = T("presAll", nT);
  document.querySelectorAll(".days button").forEach(b=>b.classList.remove("on"));
  let html="", last="", lastDay="";
  for(const it of items){
    if(it.dia!==lastDay){ html += `<h3 class="sec day">${esc(DIAS_L[it.dia]||it.dia)}</h3>`; lastDay=it.dia; last=""; }
    if(it.inicio!==last){ html += `<div class="slot">${esc(it.inicio)}</div>`; last=it.inicio; }
    html += cardHTML(it);
  }
  $("#list").innerHTML = html || `<div class="empty">${T("noRes")}</div>`;
}

const salaN = s => parseInt(String(s).replace(/\D/g,"")) || 99;
function renderBlocks(){
  document.querySelectorAll(".days button").forEach(b=>b.classList.toggle("on", b.dataset.day===state.day));
  const now = nowParts();
  const day = D.items.filter(it => it.dia === state.day)
    .sort((a,b)=> a.inicio.localeCompare(b.inicio) || (isTalk(a)-isTalk(b)));
  const posterStarts = new Set(day.filter(it=>it.tipo==="poster").map(it=>it.inicio));
  // Las actividades generales (sin sala) separan el día en tramos; dentro de cada tramo,
  // un bloque por sala y sesión. Las actividades con sala (semi-plenarias) van como una fila más.
  const segs = []; let grp = null;
  for(const it of day){
    if(it.tipo === "evento" && !it.sala){
      grp = null;
      if(!(posterStarts.has(it.inicio) && /p[oó]ster/i.test(it.titulo))) segs.push({ev:it}); // el concurso lo representa el bloque de pósters
      continue;
    }
    if(!grp){ grp = {rows:new Map()}; segs.push(grp); }
    const k = it.tipo === "evento" ? "ev:"+it.id : `${it.dia}|${it.sala}|${it.sesion}|${segs.length}`;
    if(!grp.rows.has(k)) grp.rows.set(k, {k, sala:it.sala, sesion:it.sesion, ev: it.tipo==="evento" ? it : null, items:[]});
    grp.rows.get(k).items.push(it);
  }
  const nT = day.filter(isTalk).length;
  $("#count").textContent = T("pres", nT);
  let h = "";
  for(const s of segs){
    if(s.ev){ h += eventHTML(s.ev); continue; }
    h += `<div class="grp">`;
    const rows = [...s.rows.values()].sort((a,b)=> salaN(a.sala)-salaN(b.sala) || a.items[0].inicio.localeCompare(b.items[0].inicio));
    for(const r of rows){
      if(r.ev){ h += eventHTML(r.ev); continue; }
      const c = (D.sesColor||{})[r.sesion] || "#ccc", o = open.has(r.k);
      const past = r.items.every(it => isPast(it, now)) ? " past" : "";
      const nombre = sesCorto(r.sesion);
      h += `<div class="blk${o?" open":""}${past}" data-open="${esc(r.k)}" style="background:${c}" role="button" aria-expanded="${o}">
              <span class="nm">${esc(r.sesion)} | ${esc(nombre)}</span><span class="sl">${esc(salaTxt(r.sala))}</span><span class="chev">▾</span></div>`;
      if(o) h += `<div class="blk-body" style="--c:${c}">` + r.items.sort((a,b)=>a.inicio.localeCompare(b.inicio)).map(it=>cardHTML(it,{showTime:true})).join("") + `</div>`;
    }
    h += `</div>`;
  }
  $("#list").innerHTML = h;
}

// ---------- Vista Ahora ----------
function nowParts(){
  if($("#sim").checked) return { dia: $("#simDay").value, hm: $("#simTime").value || "00:00" };
  const d = new Date(Date.now() + (new Date().getTimezoneOffset() - 180) * 60000); // hora de Mendoza
  const p = n => String(n).padStart(2,"0");
  return { dia:`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`, hm:`${p(d.getHours())}:${p(d.getMinutes())}` };
}
function renderNow(){
  const {dia, hm} = nowParts();
  $("#clock").textContent = hm;
  const today = D.items.filter(it => it.dia === dia);
  if(!today.length){
    $("#nowMsg").textContent = dia < "2026-11-10" ? T("notStarted") : T("noToday");
    $("#nowList").innerHTML = ""; return;
  }
  $("#nowMsg").textContent = DIAS_L[dia] || dia;
  const live = today.filter(it => it.inicio <= hm && hm < (it.fin || it.inicio));
  const starts = [...new Set(today.filter(it => it.inicio > hm).map(it => it.inicio))].sort();
  const next = starts.length ? today.filter(it => it.inicio === starts[0]) : [];
  const sortS = a => a.sort((x,y)=> isTalk(x)-isTalk(y) || x.sala.localeCompare(y.sala,undefined,{numeric:true}));
  let h = `<h3 class="sec">${T("live")}</h3>` + (live.length ? sortS(live).map(it => isTalk(it)?cardHTML(it,{showTime:true}):eventHTML(it)).join("") : `<div class="empty" style="padding:14px">${T("nothingLive")}</div>`);
  if(next.length) h += `<h3 class="sec">${T("next", esc(starts[0]))}</h3>` + sortS(next).map(it => isTalk(it)?cardHTML(it,{showTime:true}):eventHTML(it)).join("");
  const myNext = today.filter(it => favs.has(it.id) && it.inicio > hm).sort((a,b)=>a.inicio.localeCompare(b.inicio));
  if(myNext.length) h += `<h3 class="sec">${T("myNext")}</h3>` + myNext.map(it=>cardHTML(it,{showTime:true})).join("");
  $("#nowList").innerHTML = h;
}

function myItems(){ return D.items.filter(it => favs.has(it.id)).sort((a,b)=> key(a).localeCompare(key(b)) || a.sala.localeCompare(b.sala,undefined,{numeric:true})); }
function renderAgenda(){

// ---------- Exportar ----------
function icsText(){
  const dt = (d,t) => d.replaceAll("-","") + "T" + t.replace(":","") + "00";
  const fold = s => s.replace(/([,;\\])/g,"\\$1").replace(/\n/g,"\\n");
  const stamp = new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  const ev = myItems().map(it => [
    "BEGIN:VEVENT", `UID:mecom2026-${it.id}@programa`, `DTSTAMP:${stamp}`,
    `DTSTART;TZID=America/Argentina/Mendoza:${dt(it.dia,it.inicio)}`,
    `DTEND;TZID=America/Argentina/Mendoza:${dt(it.dia,it.fin||it.inicio)}`,
    `SUMMARY:${fold(`[${it.sesion}] ${it.titulo || T("paper", it.id)}`)}`,
    `LOCATION:${fold(`${salaTxt(it.sala)} · UTN FRM, Rodríguez 273, Mendoza`)}`,
    `DESCRIPTION:${fold(`${it.autores||""}\n${T("paperN", it.id)} · ${sesName(it.sesion)}`)}`,
    "END:VEVENT"].join("\r\n"));
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//MECOM2026//Programa//ES","CALSCALE:GREGORIAN",
    "BEGIN:VTIMEZONE","TZID:America/Argentina/Mendoza","BEGIN:STANDARD","DTSTART:19700101T000000","TZOFFSETFROM:-0300","TZOFFSETTO:-0300","TZNAME:-03","END:STANDARD","END:VTIMEZONE",
    ...ev, "END:VCALENDAR"].join("\r\n");
}
async function exportIcs(){
  if(!favs.size) return toast(T("tEmpty"));
  const data = icsText(), filename = T("icsFile");
  try{
    const dl = window.claude ? await window.claude.use("downloads") : null;
    if(dl){ await dl.save({filename, data}); return; }
  }catch(e){ if(window.claude) return toast(T("tCancel")); }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data],{type:"text/calendar"})); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}
async function copyList(){
  if(!favs.size) return toast(T("tEmpty"));
  let last="", txt=T("copyHead")+"\n";
  for(const it of myItems()){
    if(it.dia!==last){ txt += `\n${DIAS_L[it.dia]}\n`; last=it.dia; }
    txt += `${it.inicio} · ${salaTxt(it.sala)} · [${it.sesion}] ${it.titulo || T("paper", it.id)}\n`;
  }
  try{ await navigator.clipboard.writeText(txt); toast(T("tCopied")); }catch(e){ toast(T("tNoCopy")); }
}

    if(favs.has(id)){ favs.delete(id); toast(T("tRm")); } else { favs.add(id); toast(T("tAdd")); }
    saveFavs(); render(); if($("#sheet").classList.contains("open")) openSheet(id); return; }

    document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b===tab));

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); setLang(b.dataset.lang); }));

// ---------- Inicio ----------
function init(){
  Object.keys(D.sesiones).sort().forEach((c,i)=> sesColor[c] = PALETTE[i % PALETTE.length]);
  const dias = [...new Set(D.items.map(it=>it.dia))].sort();
  const {dia:hoy} = nowParts();
  state.day = state.day && dias.includes(state.day) ? state.day : (dias.includes(hoy) ? hoy : dias[0]);
  $("#days").innerHTML = dias.map(d => `<button data-day="${d}" class="${d===state.day?"on":""}"><b>${DIAS[d]||d}</b><span>${monTxt(d)}</span></button>`).join("");
  $("#simDay").innerHTML = dias.map(d => `<option value="${d}">${DIAS_L[d]||d}</option>`).join("");
  const sesUsed = [...new Set(D.items.filter(isTalk).map(it=>it.sesion))].sort();
  $("#fSes").innerHTML = `<option value="">${T("allSes")}</option>` + sesUsed.map(c=>`<option value="${esc(c)}">${esc(c)} · ${esc(sesName(c))}</option>`).join("");
  $("#fSes").value = state.ses;
  updFooter();
  updBadge(); render();
}
applyLang(); init(); renderCfg(); tryLive();
// Funciona sin conexión cuando la app está publicada en un sitio propio (no aplica dentro de Claude).
if("serviceWorker" in navigator && window.isSecureContext && /^https?:$/.test(location.protocol)){
  const habiaControl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").then(r => { window._swReg = r; }).catch(()=>{});
  // Cuando se instala una versión nueva del diseño o del código, se recarga la página una sola vez.
  // Hay una versión nueva del diseño o del código: se aplica sin interrumpir la lectura.
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if(!habiaControl) return;
    window._versionNueva = true;
    if(document.visibilityState === "hidden" || window._updManual) recargar();
    else { $("#noticeTxt").textContent = T("nNewVer");
           $("#notice").classList.remove("warn"); $("#notice").classList.add("show"); }
  });
  document.addEventListener("visibilitychange", () => { if(window._versionNueva && document.visibilityState === "hidden") recargar(); });
}
</script>
